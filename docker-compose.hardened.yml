version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cdls_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-cdls_secure_admin}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME:-cdls_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cdls_api_gateway
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-cdls_secure_admin}:${DB_PASS}@postgres:5432/${DB_NAME:-cdls_production}
      - CDLS_ALLOWED_ORIGINS=https://juliomanaging-creator.github.io
    depends_on:
      - postgres
    restart: always

volumes:

  postgres_data:
